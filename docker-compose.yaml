services:
  runiccommunityhelper.app:
    build:
      context: .
      dockerfile: src/RunicCommunityHelper.App/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GOOGLE_CREDENTIALS_PATH=/app/google-key.json
    volumes:
      - ./google-key.json:/app/google-key.json:ro
      - ./data:/app/data
    ports:
      - "5024:8080"